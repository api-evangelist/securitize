  /v1/domains/list:
    get:
      operationId: DomainsController_getDomains
      parameters:
      - name: limit
        required: false
        in: query
        description: 'Allowed values:  1, 6, 9, 12, 15, or 999'
        schema:
          enum:
          - 1
          - 6
          - 9
          - 12
          - 15
          - 999
          type: number
      - name: domainIds
        required: false
        in: query
        description: comma-separated values
        schema:
          format: form
          type: array
          items:
            type: string
      - name: page
        required: false
        in: query
        schema:
          type: number
      - name: q
        required: false
        in: query
        schema:
          type: string
      - name: tokenName
        required: false
        in: query
        schema:
          type: string
      - name: dashboardUrl
        required: false
        in: query
        schema:
          type: string
      - name: isDemo
        required: false
        in: query
        schema:
          type: boolean
      - name: orderField
        required: false
        in: query
        schema:
          enum:
          - created-at
          type: string
      - name: orderDirection
        required: false
        in: query
        schema:
          enum:
          - asc
          - desc
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDomainsResponseDto'
      tags:
      - Domains
      summary: Domains controller get domains
      x-summary-source: derived
