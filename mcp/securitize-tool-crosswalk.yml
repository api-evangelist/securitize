  openapi:
    file: openapi/securitize-domains-openapi-original.json
    title: Securitize Domains API
    version: 3.0.0
    paths: 87
    operations: 125
    base_url: https://public-api.securitize.io/
    gated: true
    gate: apiKey in Authorization header, issued by Securitize customer success
  mcp:
