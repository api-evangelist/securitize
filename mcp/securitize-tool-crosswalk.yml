notes:
- >-
  Because no MCP tool is backed by a published REST operation, none of the five tools can inherit a real
  inputSchema from the spec. Their schemas in mcp/securitize-mcp.yml are the LIVE ones the server itself returned,
  which is a stronger source than a derived binding would have been.
- >-
  The gap worth naming to Securitize: the public asset catalog the MCP server reads has no documented REST
  equivalent, so a non-agent integrator cannot get the same data. Publishing that catalog as REST (or an OpenAPI
  for the service behind mcp.securitize.io) would close the divergence in the right direction.
