    gated: false
    note: tools/list answered anonymously on 2026-08-05
  graphql: null
crosswalk: []
mcp_only:
- tool: get_securitize_assets
  reason: >-
    Returns the public catalog of Securitize-tokenized assets. The Domains API has no cross-domain asset catalog
    operation; its closest surface, TokensController_getTokens, is scoped to a single {domainId} and requires an
    operator API key.
- tool: get_asset_count
  reason: Aggregate count over the public asset catalog. No REST operation returns a catalog-wide count.
- tool: search_assets
  reason: >-
    Free-text search by symbol or description across the public catalog. The Domains API q parameter searches
    investors and holders inside one domain, not assets across domains.
- tool: get_asset_details
  reason: >-
    Asset detail keyed by public ticker symbol (BUIDL, ACRED, VBILL). Domains API token lookups are keyed by
    {domainId} + {tokenId} UUIDs, not by public symbol, and are operator-scoped.
- tool: get_token_info
  reason: >-
    On-chain token metadata including contract addresses and bridge details. The Domains API exposes blockchain
    transaction operations for a domain's own token but publishes no public contract-address/bridge lookup.
