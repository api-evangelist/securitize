description: >-
  Binds the five live Securitize MCP tools to the Securitize Domains API OpenAPI. The headline finding is a
  complete surface divergence: the MCP server projects the PUBLIC tokenized-asset catalog (assets, symbols,
  on-chain token metadata), while the Domains API projects the PRIVATE, per-domain operator workspace (investors,
  KYC, issuances, transactions). Not one of the five MCP tools has a backing operation in the published OpenAPI,
  and not one of the 125 REST operations has an MCP tool. They are two disjoint projections of the Securitize
  data core, not overlapping ones.
