- name: Securitize MCP Server
  description: >-
    Public, unauthenticated Model Context Protocol server ("Securitize Connector") that gives AI assistants and
    agents real-time, standardized access to the Securitize tokenized-asset catalog — listing assets, counting
    them, searching by symbol or description, and retrieving asset detail and on-chain token information including
    contract addresses and bridge details. Streamable HTTP transport, MCP protocol version 2025-06-18.
  humanURL: https://securitize.io/learn/blog/Introducing-the-Securitize-MCP-Server-A-Gateway-to-Tokenized-Asset-Data
  baseURL: https://mcp.securitize.io/mcp
