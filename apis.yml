    note: >-
      The Connect API docs link to a Securitize iD Swagger at https://sec-id-api.sandbox.securitize.io/swagger#/
      as "the reference documentation"; that path and every /swagger-json, /openapi.json and /api-json
      variant on both the sandbox and production hosts returned 404 on 2026-08-05. No OpenAPI was authored
      on the provider's behalf.
- name: Securitize MCP Server
  description: >-
    Public, unauthenticated Model Context Protocol server ("Securitize Connector") that gives AI assistants
    and agents real-time, standardized access to the Securitize tokenized-asset catalog — listing assets,
    counting them, searching by symbol or description, and retrieving asset detail and on-chain token
    information including contract addresses and bridge details. Streamable HTTP transport, MCP protocol
    version 2025-06-18.
  humanURL: >-
    https://securitize.io/learn/blog/Introducing-the-Securitize-MCP-Server-A-Gateway-to-Tokenized-Asset-Data
  baseURL: https://mcp.securitize.io/mcp
  tags:
  - mcp
  - agent-native
  - tokenization
  - real-world-assets
