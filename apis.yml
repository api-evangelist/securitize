apis:
- name: Securitize Domains API
  description: >-
    Comprehensive backend REST API giving domain operators (issuers, brokerage firms, secondary-market operators)
    programmatic access to the entire digital-securities lifecycle: investor onboarding and management, KYC and
    accreditation status, investor documents and legal signers, investment opportunities, pledges, funding and
    transactions, issuances, token wallets, blockchain transaction preparation and signing, NAV, snapshots, holder
    lists, Travel Rule investor registration, and webhook subscriptions. 87 paths / 125 operations, authenticated
    with an API key in the Authorization header.
