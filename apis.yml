- name: Securitize Connect API (Securitize iD)
  description: >-
    OAuth-based identity API that lets partners add "Log in with Securitize iD" to their own application and, with
    investor consent, retrieve verified KYC/KYB/AML identity data — investor information, verification details,
    investor documents, legal signers, and registered wallets. Scopes are limited to info, details, and
    verification. Documented endpoint surface only; Securitize publishes no machine-readable specification for this
    API and the Swagger reference its docs link to now returns 404.
  humanURL: https://sec-connect-api-docs.securitize.io/
  baseURL: https://sec-id-api.securitize.io/
