aid: securitize
name: Securitize
description: >-
  Securitize is a tokenization platform and SEC-registered financial services group that issues, manages, and
  services digital securities representing real-world assets — tokenized U.S. Treasuries, private credit, private
  equity, funds, and equities — for asset managers including BlackRock (BUIDL), Apollo (ACRED), Hamilton Lane,
  KKR, and VanEck (VBILL). The company operates a registered transfer agent, broker-dealer (Securitize Markets),
  alternative trading system, fund administration business, and an EU-approved investment firm, and it publishes
  three developer-facing APIs: a Domain API covering the full securities lifecycle (investor onboarding, KYC/KYB,
  accreditation, fundraising, issuance, token wallets, blockchain transactions, snapshots, and holder records), a
  Connect API that acts as an OAuth provider for Securitize iD single sign-on and verified-identity sharing, and a
  Webhook API for real-time investor event delivery. Securitize also runs a public, unauthenticated MCP server that
  exposes its tokenized-asset catalog to AI agents.
